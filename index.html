    <script>
      // Immediate early service worker registration for Android Chrome PWA
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('[Map2Medic] Service Worker registered early:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[Map2Medic] Service Worker early registration warning:', err);
          });
      }
    </script>
